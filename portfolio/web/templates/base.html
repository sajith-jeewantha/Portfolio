{% load static %}

<!doctype html>
<html>

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{% static '/css/app.css' %}">
    <link rel="icon" type="image/png" href="{% static '/icon/icon.svg' %}">

    <title>{% block title %} {% endblock %}</title>


    <meta name="description" content="{% block meta_description %}{% endblock %}">
    <meta name="keywords" content="{% block keywords %}{% endblock %}">
    <meta name="author" content="{% block author %}{% endblock %}">

    <link rel="canonical" href="{{ request.build_absolute_uri }}">
    <link rel="icon" type="image/svg+xml" href="{% static '/icon/icon.svg' %}">

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="{% block og:title %}{% endblock %}">
    <meta property="og:description"
          content="{% block og:description %}{% endblock %}">
    <meta property="og:type" content="{% block og:type %}{% endblock %}">
    <meta property="og:url" content="{% block og:url %}{% endblock %}">
    <meta property="og:image" content="{% block og:image %}{% endblock %}">

    <!--     Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter:title %}{% endblock %}">
    <meta name="twitter:description"
          content="{% block twitter:description %}{% endblock %}">
    <meta name="twitter:image" content="{% block twitter:image %}{% endblock %}">

    <!-- Theme color (mobile browsers) -->
    <meta name="theme-color" content="#4F46E5">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        'secondary': {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        'accent': {
                            'linkedin': '#0A66C2',
                            'github': '#333333',
                            'facebook': '#1877F2',
                            'instagram': '#E4405F',
                            'youtube': '#FF0000',
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'slide-up': 'slideUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100">

{% include 'partials/_header.html' %}

{% block content %}

{% endblock %}

{% include 'partials/_footer.html' %}

<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js'></script>
<script src="https://kit.fontawesome.com/95a02bd20d.js"></script>
<script src="https://unpkg.com/ionicons@4.1.2/dist/ionicons.js"></script>
<script src="{% static '/js/app.js' %}"></script>
</body>

</html>
