name: Release to Production

on:
   push:
     branches:
       - master

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decode and Setup GCP Credentials
        # This step decodes the secret and tells the runner where to find it
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT }}" | base64 -d > ${HOME}/gcp-key.json
          
          # Crucial: This makes the variable available to ALL following steps
          echo "GOOGLE_APPLICATION_CREDENTIALS=${HOME}/gcp-key.json" >> $GITHUB_ENV
          
          # Check if the file is actually a valid JSON (for debugging)
          if jq empty ${HOME}/gcp-key.json; then
            echo "Credential file is valid JSON."
          else
            echo "ERROR: Decoded secret is NOT a valid JSON. Check your base64 string!"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v2'
        with:
          # We point the auth action to the file we just created
          credentials_json: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verify Identity and Bucket Access
        run: |
          echo "Current Identity:"
          gcloud auth list
          
          echo "Checking bucket access..."
          # Replace 'your-bucket-name' with your actual bucket name
          gsutil ls gs://sj-portfolio-tf-state || (echo "ERROR: Still cannot see bucket!" && exit 1)

      - name: Terraform Init & Apply
        run: |
          terraform init -reconfigure
          terraform workspace select production || terraform workspace new production
          terraform apply -auto-approve
