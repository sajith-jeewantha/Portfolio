name: Release to Production

on:
  push:
    branches:
      - master

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.PROJECT }}       # GCP project ID
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}   # Docker image name
      REGION: asia-south1                      # Cloud Run region
      CLOUDSQL_INSTANCE: ${{ secrets.INSTANCE_CONNECTION_NAME }}  # Cloud SQL instance

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform
        id: credentials
        run: |
          # Get GCP credentials
          echo "${KEY}" | base64 -d > ~/key.json
          export GOOGLE_APPLICATION_CREDENTIALS=~/key.json
          cd terraform
          terraform init
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}"

        env:
          KEY: ${{secrets.SERVICE_ACCOUNT}}
          GOOGLE_APPLICATION_CREDENTIALS: ~/key.json