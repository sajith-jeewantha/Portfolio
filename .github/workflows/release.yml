name: Release to Production

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Required for secure GCP authentication

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    environment: production

    # This ensures all 'run' commands happen inside your terraform folder
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decode GCP Service Account Key
        # We decode the base64 secret into a temporary file on the runner
        run: echo "${{ secrets.SERVICE_ACCOUNT }}" | base64 -d > ${HOME}/gcp-key.json

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          # Point the auth action to the file we just created
          credentials_json: '${{ secrets.SERVICE_ACCOUNT }}'
          # Note: The Google Auth action is smart enough to detect
          # if the string is base64 or raw JSON.

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          # 1. Initialize (This connects to your GCS bucket)
          terraform init
          terraform validate
          terraform workspace select production || terraform workspace new production
          terraform apply -auto-approve